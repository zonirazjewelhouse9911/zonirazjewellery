<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 85 85" width="85" height="85" fill="none">
  <!-- Mango Leaves -->
  <path d="M5 5 C23 18 40 12 53 26 C41 36 17 30 5 5 Z" fill="url(#leafGradL)" opacity="0.95"/>
  <path d="M1 18 C17 34 29 36 37 50 C23 54 8 42 1 18 Z" fill="url(#leafGrad2L)" opacity="0.9"/>
  <!-- Hanging fairy light beads -->
  <circle cx="61" cy="22" r="2.8" fill="#ffffff" filter="drop-shadow(0 0 4px #ffd700)"/>
  <circle cx="49" cy="42" r="2.8" fill="#ffe680" filter="drop-shadow(0 0 4px #ff9800)"/>
  <!-- Primary Saffron Marigold Flower -->
  <g transform="translate(27, 26)">
    <circle cx="0" cy="-14" r="7.5" fill="#d35400"/>
    <circle cx="10" cy="-10" r="7.5" fill="#e67e22"/>
    <circle cx="14" cy="0" r="7.5" fill="#f39c12"/>
    <circle cx="10" cy="10" r="7.5" fill="#f1c40f"/>
    <circle cx="0" cy="14" r="7.5" fill="#f39c12"/>
    <circle cx="-10" cy="10" r="7.5" fill="#e67e22"/>
    <circle cx="-14" cy="0" r="7.5" fill="#d35400"/>
    <circle cx="-10" cy="-10" r="7.5" fill="#e67e22"/>
    <!-- Inner Layer -->
    <circle cx="0" cy="-7" r="5.5" fill="#f39c12"/>
    <circle cx="6" cy="-5" r="5.5" fill="#f1c40f"/>
    <circle cx="7" cy="0" r="5.5" fill="#f39c12"/>
    <circle cx="6" cy="5" r="5.5" fill="#f1c40f"/>
    <circle cx="0" cy="7" r="5.5" fill="#f39c12"/>
    <circle cx="-6" cy="5" r="5.5" fill="#f1c40f"/>
    <circle cx="-7" cy="0" r="5.5" fill="#f39c12"/>
    <circle cx="-6" cy="-5" r="5.5" fill="#f1c40f"/>
    <!-- Center Core -->
    <circle cx="0" cy="0" r="5" fill="#b94a00"/>
    <circle cx="0" cy="0" r="3" fill="#7e3200"/>
  </g>
  <!-- Secondary Yellow Marigold Bloom -->
  <g transform="translate(51, 18)">
    <circle cx="0" cy="-9" r="5" fill="#f39c12"/>
    <circle cx="7" cy="-6" r="5" fill="#f1c40f"/>
    <circle cx="9" cy="0" r="5" fill="#fff275"/>
    <circle cx="7" cy="6" r="5" fill="#f1c40f"/>
    <circle cx="0" cy="9" r="5" fill="#f39c12"/>
    <circle cx="-7" cy="6" r="5" fill="#f1c40f"/>
    <circle cx="-9" cy="0" r="5" fill="#fff275"/>
    <circle cx="-7" cy="-6" r="5" fill="#f1c40f"/>
    <circle cx="0" cy="0" r="3.5" fill="#d35400"/>
  </g>
  <!-- Traditional Golden Diya with Glowing Radiant Flame -->
  <g transform="translate(57, 48)">
    <path d="M-15 6 C-13 15 13 15 15 6 C9 7 -9 7 -15 6 Z" fill="url(#diyaGradL)" filter="drop-shadow(0 3px 5px rgba(0,0,0,0.6))"/>
    <circle cx="0" cy="-3" r="10" fill="rgba(255, 170, 30, 0.55)" filter="drop-shadow(0 0 8px #ff9800)"/>
    <path d="M0 -15 C4 -9 5 -4 0 2 C-5 -4 -4 -9 0 -15 Z" fill="url(#flameGradL)"/>
    <ellipse cx="0" cy="-2" rx="1.6" ry="4" fill="#ffffff"/>
  </g>
  <defs>
    <linearGradient id="leafGradL" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#145a32"/>
    </linearGradient>
    <linearGradient id="leafGrad2L" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#0e3e23"/>
    </linearGradient>
    <linearGradient id="diyaGradL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#6d4c14"/>
    </linearGradient>
    <linearGradient id="flameGradL" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="35%" stop-color="#f39c12"/>
      <stop offset="75%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
</svg>