<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 48" width="100%" height="48" fill="none" preserveAspectRatio="none">
  <!-- Golden Braided Thread -->
  <path d="M0 8 Q50 24 100 8 Q150 24 200 8 Q250 24 300 8 Q350 24 400 8 Q450 24 500 8 Q550 24 600 8 Q650 24 700 8 Q750 24 800 8" stroke="#e5be75" stroke-width="2.5" opacity="0.95"/>
  <path d="M0 8 Q50 24 100 8 Q150 24 200 8 Q250 24 300 8 Q350 24 400 8 Q450 24 500 8 Q550 24 600 8 Q650 24 700 8 Q750 24 800 8" stroke="#ffd700" stroke-width="1" opacity="0.9" stroke-dasharray="4 3"/>

  <!-- Hanging Mango / Ashoka Leaves at each scallop apex -->
  <g fill="url(#leafGradNav)">
    <path d="M50 22 C42 36 50 44 50 46 C50 44 58 36 50 22 Z"/>
    <path d="M150 22 C142 36 150 44 150 46 C150 44 158 36 150 22 Z"/>
    <path d="M250 22 C242 36 250 44 250 46 C250 44 258 36 250 22 Z"/>
    <path d="M350 22 C342 36 350 44 350 46 C350 44 358 36 350 22 Z"/>
    <path d="M450 22 C442 36 450 44 450 46 C450 44 458 36 450 22 Z"/>
    <path d="M550 22 C542 36 550 44 550 46 C550 44 558 36 550 22 Z"/>
    <path d="M650 22 C642 36 650 44 650 46 C650 44 658 36 650 22 Z"/>
    <path d="M750 22 C742 36 750 44 750 46 C750 44 758 36 750 22 Z"/>
  </g>

  <!-- Marigold Garlands (Orange & Yellow Blooms) -->
  <!-- Top knots -->
  <g>
    <!-- Knots at 0, 100, 200, 300, 400, 500, 600, 700, 800 -->
    <circle cx="0" cy="8" r="6" fill="#f39c12"/>
    <circle cx="0" cy="8" r="3.5" fill="#d35400"/>
    <circle cx="100" cy="8" r="6" fill="#f1c40f"/>
    <circle cx="100" cy="8" r="3.5" fill="#e67e22"/>
    <circle cx="200" cy="8" r="6" fill="#f39c12"/>
    <circle cx="200" cy="8" r="3.5" fill="#d35400"/>
    <circle cx="300" cy="8" r="6" fill="#f1c40f"/>
    <circle cx="300" cy="8" r="3.5" fill="#e67e22"/>
    <circle cx="400" cy="8" r="6.5" fill="#e67e22" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>
    <circle cx="400" cy="8" r="4" fill="#d35400"/>
    <circle cx="500" cy="8" r="6" fill="#f1c40f"/>
    <circle cx="500" cy="8" r="3.5" fill="#e67e22"/>
    <circle cx="600" cy="8" r="6" fill="#f39c12"/>
    <circle cx="600" cy="8" r="3.5" fill="#d35400"/>
    <circle cx="700" cy="8" r="6" fill="#f1c40f"/>
    <circle cx="700" cy="8" r="3.5" fill="#e67e22"/>
    <circle cx="800" cy="8" r="6" fill="#f39c12"/>
    <circle cx="800" cy="8" r="3.5" fill="#d35400"/>
  </g>

  <!-- Hanging Marigold Blooms at Centers of Scallops -->
  <g>
    <circle cx="50" cy="22" r="7" fill="#f39c12" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>
    <circle cx="50" cy="22" r="4" fill="#e67e22"/>
    <circle cx="50" cy="22" r="2" fill="#d35400"/>

    <circle cx="150" cy="22" r="7" fill="#f1c40f" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>
    <circle cx="150" cy="22" r="4" fill="#f39c12"/>
    <circle cx="150" cy="22" r="2" fill="#d35400"/>

    <circle cx="250" cy="22" r="7" fill="#f39c12" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>
    <circle cx="250" cy="22" r="4" fill="#e67e22"/>
    <circle cx="250" cy="22" r="2" fill="#d35400"/>

    <circle cx="350" cy="22" r="7" fill="#f1c40f" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>
    <circle cx="350" cy="22" r="4" fill="#f39c12"/>
    <circle cx="350" cy="22" r="2" fill="#d35400"/>

    <circle cx="450" cy="22" r="7" fill="#f39c12" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>
    <circle cx="450" cy="22" r="4" fill="#e67e22"/>
    <circle cx="450" cy="22" r="2" fill="#d35400"/>

    <circle cx="550" cy="22" r="7" fill="#f1c40f" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>
    <circle cx="550" cy="22" r="4" fill="#f39c12"/>
    <circle cx="550" cy="22" r="2" fill="#d35400"/>

    <circle cx="650" cy="22" r="7" fill="#f39c12" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>
    <circle cx="650" cy="22" r="4" fill="#e67e22"/>
    <circle cx="650" cy="22" r="2" fill="#d35400"/>

    <circle cx="750" cy="22" r="7" fill="#f1c40f" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>
    <circle cx="750" cy="22" r="4" fill="#f39c12"/>
    <circle cx="750" cy="22" r="2" fill="#d35400"/>
  </g>

  <!-- Glowing Hanging Fairy Light Bulbs & Diyas -->
  <!-- Hanging mini brass diyas at alternate scallops (150, 350, 550, 750) -->
  <g>
    <!-- 150 -->
    <path d="M144 38 C145 42 155 42 156 38 Z" fill="#d4af37"/>
    <circle cx="150" cy="35" r="4" fill="rgba(255,180,30,0.7)" filter="drop-shadow(0 0 6px #ff9800)"/>
    <ellipse cx="150" cy="34" rx="1.5" ry="3" fill="#ffffff"/>

    <!-- 350 -->
    <path d="M344 38 C345 42 355 42 356 38 Z" fill="#d4af37"/>
    <circle cx="350" cy="35" r="4" fill="rgba(255,180,30,0.7)" filter="drop-shadow(0 0 6px #ff9800)"/>
    <ellipse cx="350" cy="34" rx="1.5" ry="3" fill="#ffffff"/>

    <!-- 550 -->
    <path d="M544 38 C545 42 555 42 556 38 Z" fill="#d4af37"/>
    <circle cx="550" cy="35" r="4" fill="rgba(255,180,30,0.7)" filter="drop-shadow(0 0 6px #ff9800)"/>
    <ellipse cx="550" cy="34" rx="1.5" ry="3" fill="#ffffff"/>

    <!-- 750 -->
    <path d="M744 38 C745 42 755 42 756 38 Z" fill="#d4af37"/>
    <circle cx="750" cy="35" r="4" fill="rgba(255,180,30,0.7)" filter="drop-shadow(0 0 6px #ff9800)"/>
    <ellipse cx="750" cy="34" rx="1.5" ry="3" fill="#ffffff"/>
  </g>

  <!-- Twinkling Fairy Light Bulbs along the Wire -->
  <g class="twinkling-fairy-bulbs">
    <circle cx="25" cy="17" r="3.5" fill="#fff6bd" filter="drop-shadow(0 0 5px #ffd700)"/>
    <circle cx="75" cy="17" r="3" fill="#ffca7a" filter="drop-shadow(0 0 5px #ff9800)"/>
    <circle cx="125" cy="17" r="3.5" fill="#fff6bd" filter="drop-shadow(0 0 5px #ffd700)"/>
    <circle cx="175" cy="17" r="3" fill="#ffca7a" filter="drop-shadow(0 0 5px #ff9800)"/>
    <circle cx="225" cy="17" r="3.5" fill="#fff6bd" filter="drop-shadow(0 0 5px #ffd700)"/>
    <circle cx="275" cy="17" r="3" fill="#ffca7a" filter="drop-shadow(0 0 5px #ff9800)"/>
    <circle cx="325" cy="17" r="3.5" fill="#fff6bd" filter="drop-shadow(0 0 5px #ffd700)"/>
    <circle cx="375" cy="17" r="3" fill="#ffca7a" filter="drop-shadow(0 0 5px #ff9800)"/>
    <circle cx="425" cy="17" r="3.5" fill="#fff6bd" filter="drop-shadow(0 0 5px #ffd700)"/>
    <circle cx="475" cy="17" r="3" fill="#ffca7a" filter="drop-shadow(0 0 5px #ff9800)"/>
    <circle cx="525" cy="17" r="3.5" fill="#fff6bd" filter="drop-shadow(0 0 5px #ffd700)"/>
    <circle cx="575" cy="17" r="3" fill="#ffca7a" filter="drop-shadow(0 0 5px #ff9800)"/>
    <circle cx="625" cy="17" r="3.5" fill="#fff6bd" filter="drop-shadow(0 0 5px #ffd700)"/>
    <circle cx="675" cy="17" r="3" fill="#ffca7a" filter="drop-shadow(0 0 5px #ff9800)"/>
    <circle cx="725" cy="17" r="3.5" fill="#fff6bd" filter="drop-shadow(0 0 5px #ffd700)"/>
    <circle cx="775" cy="17" r="3" fill="#ffca7a" filter="drop-shadow(0 0 5px #ff9800)"/>
  </g>

  <defs>
    <linearGradient id="leafGradNav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="60%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#145a32"/>
    </linearGradient>
  </defs>
</svg>