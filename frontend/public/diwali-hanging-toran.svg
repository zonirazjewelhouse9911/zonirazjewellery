<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 36" width="100%" height="36" fill="none" preserveAspectRatio="none">
  <!-- Golden string line -->
  <path d="M0 6 Q75 18 150 6 Q225 18 300 6 Q375 18 450 6 Q525 18 600 6" stroke="#d4af37" stroke-width="1.5" fill="none" opacity="0.8"/>
  <!-- Hanging Mango leaves and Marigold blooms along the string -->
  <g fill="#27ae60">
    <!-- Leaves -->
    <path d="M75 18 C70 28 80 28 75 18 Z"/>
    <path d="M225 18 C220 28 230 28 225 18 Z"/>
    <path d="M375 18 C370 28 380 28 375 18 Z"/>
    <path d="M525 18 C520 28 530 28 525 18 Z"/>
  </g>
  <!-- Marigold flowers and fairy bulbs at peaks and drops -->
  <!-- Yellow marigolds -->
  <circle cx="75" cy="18" r="5.5" fill="#f1c40f"/>
  <circle cx="75" cy="18" r="3.5" fill="#e67e22"/>
  <circle cx="225" cy="18" r="5.5" fill="#f39c12"/>
  <circle cx="225" cy="18" r="3.5" fill="#d35400"/>
  <circle cx="375" cy="18" r="5.5" fill="#f1c40f"/>
  <circle cx="375" cy="18" r="3.5" fill="#e67e22"/>
  <circle cx="525" cy="18" r="5.5" fill="#f39c12"/>
  <circle cx="525" cy="18" r="3.5" fill="#d35400"/>

  <!-- Glowing warm fairy light bulbs along the wire -->
  <g class="toran-fairy-lights">
    <circle cx="38" cy="14" r="3" fill="#fff2a8" filter="drop-shadow(0 0 4px #ffc107)"/>
    <circle cx="112" cy="14" r="3" fill="#ffd199" filter="drop-shadow(0 0 4px #ff9800)"/>
    <circle cx="188" cy="14" r="3" fill="#fff2a8" filter="drop-shadow(0 0 4px #ffc107)"/>
    <circle cx="262" cy="14" r="3" fill="#ffd199" filter="drop-shadow(0 0 4px #ff9800)"/>
    <circle cx="338" cy="14" r="3" fill="#fff2a8" filter="drop-shadow(0 0 4px #ffc107)"/>
    <circle cx="412" cy="14" r="3" fill="#ffd199" filter="drop-shadow(0 0 4px #ff9800)"/>
    <circle cx="488" cy="14" r="3" fill="#fff2a8" filter="drop-shadow(0 0 4px #ffc107)"/>
    <circle cx="562" cy="14" r="3" fill="#ffd199" filter="drop-shadow(0 0 4px #ff9800)"/>
  </g>
</svg>