<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="70" height="70" fill="none">
  <!-- Mango Leaf -->
  <path d="M65 5 C50 15 35 10 25 22 C35 30 55 25 65 5 Z" fill="url(#leafGrad)" opacity="0.95"/>
  <path d="M68 15 C55 28 45 30 38 42 C50 45 62 35 68 15 Z" fill="url(#leafGrad2)" opacity="0.9"/>
  <!-- Marigold Flower Outer Petals -->
  <g transform="translate(48, 22)">
    <!-- 8 Petals -->
    <circle cx="0" cy="-11" r="6" fill="#e67e22"/>
    <circle cx="8" cy="-8" r="6" fill="#f39c12"/>
    <circle cx="11" cy="0" r="6" fill="#f1c40f"/>
    <circle cx="8" cy="8" r="6" fill="#f39c12"/>
    <circle cx="0" cy="11" r="6" fill="#e67e22"/>
    <circle cx="-8" cy="8" r="6" fill="#f39c12"/>
    <circle cx="-11" cy="0" r="6" fill="#f1c40f"/>
    <circle cx="-8" cy="-8" r="6" fill="#f39c12"/>
    <!-- Inner Petals -->
    <circle cx="0" cy="-6" r="4.5" fill="#f39c12"/>
    <circle cx="5" cy="-4" r="4.5" fill="#f1c40f"/>
    <circle cx="6" cy="0" r="4.5" fill="#f39c12"/>
    <circle cx="5" cy="4" r="4.5" fill="#f1c40f"/>
    <circle cx="0" cy="6" r="4.5" fill="#f39c12"/>
    <circle cx="-5" cy="4" r="4.5" fill="#f1c40f"/>
    <circle cx="-6" cy="0" r="4.5" fill="#f39c12"/>
    <circle cx="-5" cy="-4" r="4.5" fill="#f1c40f"/>
    <!-- Center Core -->
    <circle cx="0" cy="0" r="4.5" fill="#d35400"/>
    <circle cx="0" cy="0" r="2.5" fill="#b94a00"/>
  </g>
  <!-- Miniature Golden Diya -->
  <g transform="translate(22, 38)">
    <!-- Diya Base -->
    <path d="M-12 5 C-10 12 10 12 12 5 C7 6 -7 6 -12 5 Z" fill="url(#diyaGrad)" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.5))"/>
    <!-- Flame Aura -->
    <circle cx="0" cy="-2" r="7" fill="rgba(255, 170, 30, 0.45)" class="flame-glow"/>
    <!-- Flame -->
    <path d="M0 -12 C3 -7 4 -3 0 2 C-4 -3 -3 -7 0 -12 Z" fill="url(#flameGrad)"/>
    <!-- Flame Core -->
    <ellipse cx="0" cy="-1" rx="1.2" ry="3" fill="#ffffff"/>
  </g>
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#145a32"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#196f3d"/>
    </linearGradient>
    <linearGradient id="diyaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f9e79f"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7d5a18"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="40%" stop-color="#f39c12"/>
      <stop offset="80%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
</svg>