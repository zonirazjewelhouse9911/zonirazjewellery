# Optimized High-Performance Media Server Configuration for media.zoniraz.com
# Enables HTTP/2 multiplexing, Linux zero-copy sendfile, byte-range video streaming, and aggressive browser caching.

server {
    listen 80;
    listen [::]:80;
    server_name media.zoniraz.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.zoniraz.com;

    root /var/www/zoniraz-media;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/media.zoniraz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.zoniraz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SSL Session Caching for lightning-fast repeated handshakes
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    # High-Throughput Kernel Optimization
    sendfile on;
    sendfile_max_chunk 512k;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    # Gzip Compression for JSON/SVG/XML (skip binary images/videos)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 1. High-Performance Static Media Route (Images & Videos)
    location /uploads/ {
        alias /var/www/zoniraz-media/uploads/;
        autoindex off;

        # 1-Year Immutable Browser Caching
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

        # Enable Byte-Range Seeking for instant MP4 video streaming & scrubbing
        aio threads;
        directio 4m;
        output_buffers 2 1m;

        try_files $uri $uri/ =404;
    }

    # 2. VPS Media Receiver Node API (for uploads)
    location /api/ {
        client_max_body_size 100M;
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Deny hidden dotfiles
    location ~ /\. {
        deny all;
    }

    # 4. Fallback 404 for root
    location / {
        return 404;
    }
}
